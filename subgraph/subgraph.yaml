specVersion: 0.0.5
schema:
  file: ./schema.graphql

features:
  - nonFatalErrors

dataSources:
  - kind: ethereum
    name: ProjectRegistry
    network: matic-amoy  # Polygon mainnet — remplacer par "matic-amoy" pour testnet
    source:
      address: "0x0000000000000000000000000000000000000000"  # à remplir après deploy
      abi: ProjectRegistry
      startBlock: 0  # à remplir après deploy (block du contrat)
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Project
        - Task
      abis:
        - name: ProjectRegistry
          file: ./abis/ProjectRegistry.json
      eventHandlers:
        - event: ProjectRegistered(indexed bytes32,indexed address,uint8,uint8)
          handler: handleProjectRegistered
        - event: MerkleRootUpdated(indexed bytes32,bytes32)
          handler: handleMerkleRootUpdated
        - event: TaskClaimed(indexed bytes32,indexed bytes32)
          handler: handleTaskClaimed
        - event: ProjectLocked(indexed bytes32)
          handler: handleProjectLocked
        - event: ProjectDeactivated(indexed bytes32)
          handler: handleProjectDeactivated
      file: ./src/projectRegistry.ts

  - kind: ethereum
    name: EscrowVault
    network: matic-amoy
    source:
      address: "0x0000000000000000000000000000000000000000"
      abi: EscrowVault
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Project
        - TaskReward
        - Punishment
        - Withdrawal
        - UTXORecord
        - Developer
      abis:
        - name: EscrowVault
          file: ./abis/EscrowVault.json
      eventHandlers:
        - event: ProjectFunded(indexed bytes32,uint256)
          handler: handleProjectFunded
        - event: TaskRewardReleased(indexed bytes32,indexed bytes32,indexed address,uint256)
          handler: handleTaskRewardReleased
        - event: PunishmentExecuted(indexed bytes32,indexed bytes32,indexed address,uint256,string)
          handler: handlePunishmentExecuted
        - event: WithdrawalExecuted(indexed address,uint256,indexed address,bytes32)
          handler: handleWithdrawalExecuted
        - event: UTXOSpent(indexed bytes32,indexed address)
          handler: handleUTXOSpent
        - event: RefundIssued(indexed bytes32,indexed address,uint256)
          handler: handleRefundIssued
        - event: UTXOMinted(indexed bytes32,indexed address,uint256,indexed bytes32)
          handler: handleUTXOMinted
      file: ./src/escrowVault.ts

  - kind: ethereum
    name: ReputationRegistry
    network: matic-amoy
    source:
      address: "0x0000000000000000000000000000000000000000"
      abi: ReputationRegistry
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Developer
        - ReputationEvent
      abis:
        - name: ReputationRegistry
          file: ./abis/ReputationRegistry.json
      eventHandlers:
        - event: ReputationUpdated(indexed address,int256,int256,indexed bytes32,string)
          handler: handleReputationUpdated
      file: ./src/reputationRegistry.ts

  - kind: ethereum
    name: CreditToken
    network: matic-amoy
    source:
      address: "0x0000000000000000000000000000000000000000"
      abi: CreditToken
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Developer
        - CreditEvent
      abis:
        - name: CreditToken
          file: ./abis/CreditToken.json
      eventHandlers:
        - event: CreditClaimed(indexed address,uint256,indexed bytes32)
          handler: handleCreditClaimed
        - event: Transfer(indexed address,indexed address,uint256)
          handler: handleTransfer
      file: ./src/creditToken.ts

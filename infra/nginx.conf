# PTF — Nginx reverse proxy
# Gère le TLS (Certbot), route /graphql et /health vers le backend framework (4000)
# et /service/* vers le backend service (4001) + frontend service (3001)

worker_processes auto;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 10m;
    server_tokens off;

    # Headers sécurité globaux
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # Logs structurés
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # Gzip
    gzip on;
    gzip_types text/plain application/json application/javascript text/css;

    # Rate limiting
    # NOTE: Le rate-limit auth par opération GraphQL (login/register) doit être
    # implémenté dans le middleware applicatif (Apollo/Express) qui inspecte
    # req.body.operationName — impossible de le faire côté Nginx car l'opération
    # est dans le body JSON, pas dans l'URL.
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

    # ── Redirections HTTP → HTTPS ──────────────────────────────────────────────
    server {
        listen 80;
        server_name _;
        location /.well-known/acme-challenge/ { root /var/www/certbot; }
        location / { return 301 https://$host$request_uri; }
    }

    # ── PTF Framework API — api.ptf-framework.dev ──────────────────────────────
    server {
        listen 443 ssl http2;
        server_name api.ptf-framework.dev;

        ssl_certificate     /etc/letsencrypt/live/api.ptf-framework.dev/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.ptf-framework.dev/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # GraphQL endpoint
        location /graphql {
            limit_req zone=api burst=50 nodelay;
            proxy_pass         http://ptf-backend:4000/graphql;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # Health check (non rate-limited)
        location /health {
            proxy_pass http://ptf-backend:4000/health;
        }
    }

    # ── PTF Service API — api.ptf-service.dev ─────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name api.ptf-service.dev;

        ssl_certificate     /etc/letsencrypt/live/api.ptf-service.dev/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.ptf-service.dev/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        location /graphql {
            limit_req zone=api burst=30 nodelay;
            proxy_pass         http://ptf-service-backend:4001/graphql;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location /health {
            proxy_pass http://ptf-service-backend:4001/health;
        }
    }

    # ── PTF Service Frontend — app.ptf-service.dev ────────────────────────────
    server {
        listen 443 ssl http2;
        server_name app.ptf-service.dev;

        ssl_certificate     /etc/letsencrypt/live/app.ptf-service.dev/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/app.ptf-service.dev/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        location / {
            proxy_pass         http://ptf-service-frontend:3001;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
    }
}

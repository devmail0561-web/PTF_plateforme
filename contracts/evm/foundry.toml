[profile.default]
src = "."
out = "out"
libs = ["lib"]
test = "test"
cache_path = "cache"
solc = "0.8.20"
optimizer = true
optimizer_runs = 200
via_ir = false
fuzz = { runs = 1000, seed = 42 }
invariant = { runs = 256, depth = 15 }

[profile.ci]
fuzz = { runs = 10000, seed = 42 }
invariant = { runs = 1024, depth = 30 }

[rpc_endpoints]
polygon-amoy = "${POLYGON_AMOY_RPC}"
polygon       = "${POLYGON_RPC}"
ethereum      = "${ETHEREUM_RPC}"

[etherscan]
polygon-amoy = { key = "${POLYGONSCAN_API_KEY}", url = "https://api-amoy.polygonscan.com/api" }
polygon       = { key = "${POLYGONSCAN_API_KEY}" }
ethereum      = { key = "${ETHERSCAN_API_KEY}" }

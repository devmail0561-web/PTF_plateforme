type Query {
  # Tasks
  tasks(filter: TaskFilterInput): [Task!]!
  task(id: ID!): Task
  myTasks(status: String): [Task!]!

  # Projects
  projects(filter: ProjectFilterInput): [Project!]!
  project(id: ID!): Project
  myProjects: [Project!]!

  # Wallet
  walletStatus(address: String!, chain: String!): WalletStatus!
  walletBalance(address: String!, chain: String!): CreditBalance!

  # Contributors (projets publics uniquement)
  projectContributors(projectId: ID!): [Contributor!]!

  # Reputation
  reputationScore(address: String!): ReputationScore!
  reputationHistory(address: String!, limit: Int, offset: Int): [ReputationEvent!]!

  # Credit ledger
  creditHistory(address: String!, limit: Int, offset: Int, type: String): [CreditEvent!]!
  creditBalance(address: String!): CreditLedgerBalance!

  # UTXO provenance
  utxos(address: String!, status: String, chain: String, limit: Int, offset: Int): [CreditUTXO!]!
  utxoBalance(address: String!): UTXOBalance!
  utxoProvenance(address: String!, limit: Int, offset: Int): [CreditUTXO!]!

  # Device management (requires JWT)
  myDevices: [DeviceSession!]!

  # License helpers (public — no auth required)
  verifyRepoLicense(repoUrl: String!): RepoLicenseInfo!
  getLicenses(category: String): [LicenseCatalogEntry!]!

  # Health
  health: String!
}

type Mutation {
  # Auth — Registration (first time only)
  register(input: RegisterInput!): AuthResult!

  # Auth — Login (email + password)
  # Known device (deviceToken provided): returns AuthResult immediately.
  # New device: sends OTP to email, returns LoginResult { pendingSessionId }.
  login(input: LoginInput!): LoginResult!
  verifyNewDevice(pendingSessionId: ID!, otp: String!): AuthResult!

  # Auth — GitHub linking (2-step CSRF-safe, requires JWT)
  # Step 1: obtain a server-generated state nonce to include in the OAuth redirect URL.
  # Step 2: exchange the code + state returned by GitHub.
  requestGithubOAuthState: GithubOAuthState!
  linkGithub(code: String!, state: String!): AuthResult!

  # Auth — Wallet linking (2-step: request nonce → EIP-712 sign)
  requestWalletChallenge(chain: String!, address: String!): WalletChallenge!
  confirmLinkWallet(challengeId: ID!, signature: String!): WalletLinkResult!

  # Device management
  revokeDevice(deviceId: ID!): Boolean!
  revokeAllOtherDevices: Boolean!

  # Projects
  createProject(input: CreateProjectInput!): CreateProjectResult!
  publishProject(projectId: ID!): Project!
  # Auto-create or update LICENSE.md in the GitHub repo (requires GitHub token with write access)
  createProjectLicense(projectId: ID!, spdxId: String!, authorName: String!, userToken: String!): ProjectLicenseResult!

  # Tasks
  generateTasks(
    projectId: ID!
    architectureMd: String!
    planActionMd: String!
  ): GenerationResult!
  claimTask(taskId: ID!, chain: String!, signedNonce: String): ClaimResult!
  submitTask(taskId: ID!, commitHash: String!, branchRef: String!): SubmitResult!
  cancelTask(taskId: ID!): Boolean!

  # UTXO withdrawal
  withdrawCredits(input: WithdrawInput!): WithdrawResult!

  # Reports
  reportUser(input: ReportInput!): Report!
}

type Subscription {
  taskStatusChanged(taskId: ID!): Task!
}

# ─── Task ───────────────────────────────────────────────────────────────────

type Task {
  id: ID!
  projectId: String!
  parentId: String
  title: String!
  type: String!
  priority: String!
  status: String!
  context: String!
  objective: String!
  deliverable: String!
  outOfScope: [String!]!
  rewardAmount: Float
  rewardToken: String
  rewardMode: String!
  duration: String!
  deadline: String
  claimedAt: String
  devAddress: String
  dependencies: [String!]!
  scoring: TaskScoring!
  reputationPoints: Int!
  claimCriteria: ClaimCriteria!
  punishments: Punishments!
  verificationSteps: [VerificationStep!]!
  constraints: TaskConstraints!
  createdAt: String!
}

type TaskScoring {
  complexity: Int!
  effort: Int!
  impact: Int!
}

type ClaimCriteria {
  minReputation: Int
  minCompletedTasks: Int
  requiredSkills: [String!]
  maxActiveTasks: Int
}

type PunishmentRule {
  credits: Float
  reputation: Int!
}

type Punishments {
  lateDelivery: PunishmentRule!
  maliciousCode: PunishmentRule!
  criticalBug: PunishmentRule!
  nonCriticalBug: PunishmentRule!
}

type VerificationStep {
  type: String!
  command: String!
  expectedOutput: String
  threshold: Float
}

type TaskConstraints {
  maxFiles: Int!
  maxLinesPerFile: Int!
  maxTotalLines: Int!
  requiredTests: Boolean!
  minTestCoverage: Int!
  languages: [String!]!
  forbiddenPatterns: [String!]!
}

input TaskFilterInput {
  status: String
  projectId: String
  rewardMode: String
  minReward: Float
  maxReward: Float
  skills: [String!]
  priority: String
  devAddress: String
  limit: Int
  offset: Int
}

# ─── Project ────────────────────────────────────────────────────────────────

type Project {
  id: ID!
  name: String!
  type: String!
  rewardMode: String!
  chain: String!
  status: String!
  owner: String!
  repository: String
  stack: [String!]!
  taskCount: Int!
  openTaskCount: Int!
  totalRewardPool: String!
  escrowBalance: Float!
  # Open-source verification
  isOpenSource: Boolean!
  license: String           # SPDX identifier, e.g. "MIT", "GPL-3.0"
  createdAt: String!
}

# Result of createProject — always created, with license status embedded.
type CreateProjectResult {
  # All Project fields
  id:           ID!    # matches Project.id — use this field for consistency
  projectId:    ID!    # kept for backwards compatibility
  name:         String!
  type:         String!
  rewardMode:   String!
  chain:        String!
  status:       String!
  owner:        String!
  repository:   String
  stack:        [String!]!
  taskCount:    Int!
  openTaskCount: Int!
  totalRewardPool: String!
  escrowBalance:   Float!
  isOpenSource: Boolean!
  license:      String
  createdAt:    String!
  # License check outcome
  licenseStatus:      String!  # "ok" | "missing" | "ineligible" | "not_github"
  licenseInstruction: String   # instructions for the user when licenseStatus != "ok"
}

# Result of createProjectLicense — reports what was committed.
type ProjectLicenseResult {
  fileUrl:     String!
  commitSha:   String!
  isOpenSource: Boolean!
  license:     String!
}

# Result of a GitHub open-source verification check.
type RepoLicenseInfo {
  isPublic:             Boolean!
  spdxId:               String    # e.g. "MIT" — null if no license detected
  isReputationEligible: Boolean!
  name:                 String!
  url:                  String
  category:             String!   # "osi" | "free" | "source" | "proprietary"
  passes:               Boolean!
  reason:               String
  instruction:          String
}

# Full license catalog entry.
type LicenseCatalogEntry {
  spdxId:             String!
  name:               String!
  category:           String!   # "osi" | "free" | "source" | "proprietary"
  isOsi:              Boolean!
  isFsf:              Boolean!
  gplCompatible:      Boolean!
  reputationEligible: Boolean!
  description:        String!
  url:                String!
}

input CreateProjectInput {
  name: String!
  type: String!
  rewardMode: String!
  chain: String!
  token: String
  repoType: String!
  repoUrl: String
  language: String
  stack: [String!]
  description: String
}

input ProjectFilterInput {
  type: String
  mine: Boolean
  status: String
  limit: Int
  offset: Int
}

# ─── Wallet ─────────────────────────────────────────────────────────────────

type WalletStatus {
  address: String!
  ptfBalance: Float!
  softLocked: Float!
  available: Float!
  reputationScore: Int!
  reputationLevel: String!
  linkedChains: [String!]!
  isValidAddress: Boolean!
  isActivated: Boolean!
  hasGasFees: Boolean!
  isNotBanned: Boolean!
  ownershipProven: Boolean!
  meetsMinBalance: Boolean!
}

type CreditBalance {
  address: String!
  balance: Float!
  softLocked: Float!
  available: Float!
}

type WalletLink {
  id: ID!
  chain: String!
  address: String!
  isPrimary: Boolean!
}

# ─── Auth ────────────────────────────────────────────────────────────────────

input RegisterInput {
  email:      String!
  password:   String!
  deviceName: String!
}

input LoginInput {
  email:       String!
  password:    String!
  deviceName:  String!
  deviceToken: String   # opaque token stored locally after first OTP verification
}

# Returned when login requires OTP (new device). pendingSessionId must be passed to verifyNewDevice.
type LoginResult {
  # Known device — login is complete.
  token:        String
  encryptedKey: String
  user:         UserProfile
  # New device — OTP sent to email.
  pendingSessionId:     String
  requiresVerification: Boolean
}

# encryptedKey lets the client decrypt the PTF private key locally.
# Format: "v1:<keySalt_hex>:<iv_hex>:<ciphertext_hex>:<authTag_hex>"
# deviceToken is only set by verifyNewDevice — store it persistently to skip OTP next time.
type AuthResult {
  token:        String!
  encryptedKey: String!
  deviceToken:  String   # only set by verifyNewDevice
  user:         UserProfile!
}

# Step 1 of GitHub OAuth: server-issued state nonce to prevent CSRF.
# Include state in the GitHub OAuth redirect URL; pass it back in linkGithub().
type GithubOAuthState {
  state: String!   # keccak256 nonce — expires in 10 minutes
}

# Step 1 of wallet-link: the client receives a nonce to sign with the wallet key.
type WalletChallenge {
  challengeId: ID!
  nonce:       String!
}

# Result of confirmLinkWallet: updated JWT + the newly created WalletLink.
type WalletLinkResult {
  token:      String!
  walletLink: WalletLink!
}

type UserProfile {
  id:           ID!
  email:        String
  ptfAddress:   String
  githubHandle: String
  githubLinked: Boolean!
  walletLinked: Boolean!
  wallets:      [WalletLink!]!
}

# One entry per connected device — visible in account settings.
type DeviceSession {
  id:         ID!
  deviceName: String
  userAgent:  String
  lastSeenAt: String!
  createdAt:  String!
  isCurrent:  Boolean!
}

# ─── Reputation ──────────────────────────────────────────────────────────────

type ReputationScore {
  address: String!
  total: Int!
  level: String!
  completedTasks: Int!
}

type ReputationEvent {
  id: ID!
  delta: Int!
  reason: String!
  taskId: String
  chain: String
  txHash: String
  createdAt: String!
}

# ─── Credit ledger ────────────────────────────────────────────────────────────

type CreditEvent {
  id: ID!
  devAddress: String!
  type: String!
  direction: String!
  amount: Float!
  balanceAfter: Float
  taskId: String
  projectId: String
  chain: String!
  txHash: String
  note: String
  createdAt: String!
}

type CreditLedgerBalance {
  address: String!
  totalCredits: Float!
  totalDebits: Float!
  net: Float!
}

# ─── UTXO provenance ─────────────────────────────────────────────────────────

type CreditUTXO {
  id:          ID!
  ownerAddress: String!
  amount:       Float!
  sourceType:   String!   # task_reward | deposit | bridge_in | change
  sourceId:     String    # taskId for rewards, deposit txHash for deposits
  projectId:    String
  chain:        String!
  txHash:       String
  status:       String!   # unspent | spent | locked
  spentInTxId:  String
  createdAt:    String!
  # eip712Signature is intentionally omitted from the public schema (CIA-C4).
  # Exposing raw EIP-712 signatures lets any client forge withdrawal proofs off-chain.
  # Retrieve signatures via the authenticated /api/utxo/:id/proof endpoint instead.
}

type UTXOBalance {
  address:   String!
  available: Float!
  locked:    Float!
  total:     Float!
}

input WithdrawInput {
  amount:      Float!
  destination: String!   # target wallet address
  chain:       String!
}

type WithdrawResult {
  txId:        String!
  netAmount:   Float!
  proofHash:   String!   # keccak256 of all input UTXO signatures — independently verifiable
  consumed:    [CreditUTXO!]!
  change:      CreditUTXO
}

# ─── Contributors ────────────────────────────────────────────────────────────

type Contributor {
  devAddress: String!
  githubHandle: String
  tasksCompleted: Int!
  totalEarned: Float!
  reputationScore: Int!
  joinedAt: String!
}

# ─── Claim / Submit ──────────────────────────────────────────────────────────

type ClaimResult {
  taskId: String!
  devAddress: String!
  claimedAt: String!
  deadline: String!
  conditionsHash: String!
  signature: String!
}

type SubmitResult {
  taskId: String!
  commitHash: String!
  branchRef: String!
  submittedAt: String!
  validationJobId: String!
}

# ─── Generation ──────────────────────────────────────────────────────────────

type GenerationResult {
  tasks: [GeneratedTask!]!
  estimation: ProjectEstimation!
}

type GeneratedTask {
  title: String!
  type: String!
  priority: String!
  rewardAmount: Float
  duration: String
  scoring: TaskScoring!
}

type ProjectEstimation {
  taskCount: Int!
  totalEffortHours: Int!
  rewardPoolSuggested: Float!
  commissionRate: Float!
  commissionAmount: Float!
  totalDeposit: Float!
}

# ─── Reports ─────────────────────────────────────────────────────────────────

type Report {
  id: ID!
  reason: String!
  status: String!
  createdAt: String!
}

input ReportInput {
  reportedAddress: String!
  taskId: String
  reason: String!
  evidence: String!
}

type Query {
  # Tasks
  tasks(filter: TaskFilterInput): [Task!]!
  task(id: ID!): Task
  myTasks(status: String): [Task!]!

  # Projects
  projects(filter: ProjectFilterInput): [Project!]!
  project(id: ID!): Project
  myProjects: [Project!]!

  # Wallet
  walletStatus(address: String!, chain: String!): WalletStatus!
  walletBalance(address: String!, chain: String!): CreditBalance!

  # Contributors (projets publics uniquement)
  projectContributors(projectId: ID!): [Contributor!]!

  # Reputation
  reputationScore(address: String!, chain: String): ReputationScore!

  # License helpers (public — no auth required)
  verifyRepoLicense(repoUrl: String!): RepoLicenseInfo!
  getLicenses(category: String): [LicenseCatalogEntry!]!

  # Health
  health: String!
}

type Mutation {
  # Auth — Challenge-response (auth primaire, stateless, pas de mot de passe côté serveur)
  # Step 1: le serveur génère un nonce en mémoire pour l'adresse PTF donnée (TTL 5 min).
  # Step 2: le client signe le nonce localement et envoie la signature.
  requestChallenge(ptfAddress: String!): ChallengeResult!
  verifyChallenge(input: VerifyChallengeInput!): AuthResult!

  # Projects
  createProject(input: CreateProjectInput!): CreateProjectResult!
  publishProject(projectId: ID!): Project!
  # Auto-create or update LICENSE.md in the GitHub repo (requires GitHub token with write access)
  createProjectLicense(projectId: ID!, spdxId: String!, authorName: String!, userToken: String!): ProjectLicenseResult!

  # Tasks
  generateTasks(
    projectId: ID!
    architectureMd: String!
    planActionMd: String!
  ): GenerationResult!
  claimTask(taskId: ID!, chain: String!, signedNonce: String): ClaimResult!
  submitTask(taskId: ID!, commitHash: String!, branchRef: String!): SubmitResult!
  cancelTask(taskId: ID!): Boolean!

  # Validation — exécute les verificationSteps d'une soumission
  validateSubmission(submissionId: ID!): ValidationReport!

  # Release reward après validation (operator uniquement — auth requise)
  releaseTaskReward(taskId: ID!, chain: String!): ReleaseResult!
}

type Subscription {
  taskStatusChanged(taskId: ID!): Task!
}

# ─── Task ───────────────────────────────────────────────────────────────────

type Task {
  id: ID!
  projectId: String!
  parentId: String
  title: String!
  type: String!
  priority: String!
  status: String!
  context: String!
  objective: String!
  deliverable: String!
  outOfScope: [String!]!
  rewardAmount: Float
  rewardToken: String
  rewardMode: String!
  duration: String!
  deadline: String
  claimedAt: String
  devAddress: String
  dependencies: [String!]!
  scoring: TaskScoring!
  reputationPoints: Int!
  claimCriteria: ClaimCriteria!
  punishments: Punishments!
  verificationSteps: [VerificationStep!]!
  constraints: TaskConstraints!
  createdAt: String!
}

type TaskScoring {
  complexity: Int!
  effort: Int!
  impact: Int!
}

type ClaimCriteria {
  minReputation: Int
  minCompletedTasks: Int
  requiredSkills: [String!]
  maxActiveTasks: Int
}

type PunishmentRule {
  credits: Float
  reputation: Int!
}

type Punishments {
  lateDelivery: PunishmentRule!
  maliciousCode: PunishmentRule!
  criticalBug: PunishmentRule!
  nonCriticalBug: PunishmentRule!
}

type VerificationStep {
  type: String!
  command: String!
  expectedOutput: String
  threshold: Float
}

type TaskConstraints {
  maxFiles: Int!
  maxLinesPerFile: Int!
  maxTotalLines: Int!
  requiredTests: Boolean!
  minTestCoverage: Int!
  languages: [String!]!
  forbiddenPatterns: [String!]!
}

input TaskFilterInput {
  status: String
  projectId: String
  rewardMode: String
  minReward: Float
  maxReward: Float
  skills: [String!]
  priority: String
  devAddress: String
  limit: Int
  offset: Int
}

# ─── Project ────────────────────────────────────────────────────────────────

type Project {
  id: ID!
  name: String!
  type: String!
  rewardMode: String!
  chain: String!
  status: String!
  owner: String!
  repository: String
  stack: [String!]!
  taskCount: Int!
  openTaskCount: Int!
  totalRewardPool: String!
  escrowBalance: Float!
  # Open-source verification
  isOpenSource: Boolean!
  license: String           # SPDX identifier, e.g. "MIT", "GPL-3.0"
  createdAt: String!
}

# Result of createProject — always created, with license status embedded.
type CreateProjectResult {
  # All Project fields
  id:           ID!    # matches Project.id — use this field for consistency
  projectId:    ID!    # kept for backwards compatibility
  name:         String!
  type:         String!
  rewardMode:   String!
  chain:        String!
  status:       String!
  owner:        String!
  repository:   String
  stack:        [String!]!
  taskCount:    Int!
  openTaskCount: Int!
  totalRewardPool: String!
  escrowBalance:   Float!
  isOpenSource: Boolean!
  license:      String
  createdAt:    String!
  # License check outcome
  licenseStatus:      String!  # "ok" | "missing" | "ineligible" | "not_github"
  licenseInstruction: String   # instructions for the user when licenseStatus != "ok"
}

# Result of createProjectLicense — reports what was committed.
type ProjectLicenseResult {
  fileUrl:     String!
  commitSha:   String!
  isOpenSource: Boolean!
  license:     String!
}

# Result of a GitHub open-source verification check.
type RepoLicenseInfo {
  isPublic:             Boolean!
  spdxId:               String    # e.g. "MIT" — null if no license detected
  isReputationEligible: Boolean!
  name:                 String!
  url:                  String
  category:             String!   # "osi" | "free" | "source" | "proprietary"
  passes:               Boolean!
  reason:               String
  instruction:          String
}

# Full license catalog entry.
type LicenseCatalogEntry {
  spdxId:             String!
  name:               String!
  category:           String!   # "osi" | "free" | "source" | "proprietary"
  isOsi:              Boolean!
  isFsf:              Boolean!
  gplCompatible:      Boolean!
  reputationEligible: Boolean!
  description:        String!
  url:                String!
}

input CreateProjectInput {
  name: String!
  type: String!
  rewardMode: String!
  chain: String!
  token: String
  repoType: String!
  repoUrl: String
  language: String
  stack: [String!]
  description: String
}

input ProjectFilterInput {
  type: String
  mine: Boolean
  status: String
  limit: Int
  offset: Int
}

# ─── Wallet ─────────────────────────────────────────────────────────────────

type WalletStatus {
  address: String!
  ptfBalance: Float!
  softLocked: Float!
  available: Float!
  reputationScore: Int!
  reputationLevel: String!
  linkedChains: [String!]!
  isValidAddress: Boolean!
  isActivated: Boolean!
  hasGasFees: Boolean!
  isNotBanned: Boolean!
  ownershipProven: Boolean!
  meetsMinBalance: Boolean!
}

type CreditBalance {
  address: String!
  balance: Float!
  softLocked: Float!
  available: Float!
}

# ─── Auth ────────────────────────────────────────────────────────────────────

# Retourné par requestChallenge — le client signe le nonce avec sa clé privée locale.
type ChallengeResult {
  nonce:     String!   # keccak256 aléatoire, TTL 5 min
  expiresAt: String!   # ISO 8601
}

input VerifyChallengeInput {
  ptfAddress: String!   # adresse PTF de l'utilisateur
  nonce:      String!   # nonce reçu via requestChallenge
  signature:  String!   # personal_sign(nonce, privateKey) — clé privée locale, ne quitte pas la machine
  deviceName: String!   # ex : "PTF CLI", "Chrome / Ubuntu"
  userAgent:  String
}

# Retourné par verifyChallenge — token JWT uniquement, pas de données utilisateur.
type AuthResult {
  token: String!        # JWT de session (30 jours)
}

# ─── Reputation ──────────────────────────────────────────────────────────────

type ReputationScore {
  address: String!
  total: Int!
  level: String!
}

# ─── Contributors ────────────────────────────────────────────────────────────

type Contributor {
  devAddress: String!
  githubHandle: String
  tasksCompleted: Int!
  totalEarned: Float!
  reputationScore: Int!
  joinedAt: String!
}

# ─── Claim / Submit ──────────────────────────────────────────────────────────

type ClaimResult {
  taskId: String!
  devAddress: String!
  claimedAt: String!
  deadline: String!
  conditionsHash: String!
  signature: String!
}

type SubmitResult {
  taskId: String!
  commitHash: String!
  branchRef: String!
  submittedAt: String!
  validationJobId: String!
}

# ─── Validation ──────────────────────────────────────────────────────────────

type ValidationReport {
  taskId: String!
  submissionId: String!
  outcome: String!    # "passed" | "failed" | "error"
  steps: [VerificationStepResult!]!
  durationMs: Int!
}

type VerificationStepResult {
  stepIndex: Int!
  passed: Boolean!
  output: String
  error: String
  durationMs: Int
}

# ─── Escrow release ───────────────────────────────────────────────────────────

type ReleaseResult {
  taskId: String!
  devAddress: String!
  amount: Float!
  txHash: String!
  utxoId: String!
  releasedAt: String!
}

# ─── Generation ──────────────────────────────────────────────────────────────

type GenerationResult {
  tasks: [GeneratedTask!]!
  estimation: ProjectEstimation!
}

type GeneratedTask {
  title: String!
  type: String!
  priority: String!
  rewardAmount: Float
  duration: String
  scoring: TaskScoring!
}

type ProjectEstimation {
  taskCount: Int!
  totalEffortHours: Int!
  rewardPoolSuggested: Float!
  commissionRate: Float!
  commissionAmount: Float!
  totalDeposit: Float!
}

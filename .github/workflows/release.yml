name: Release

on:
  push:
    tags:
      - "v*.*.*"

env:
  NODE_VERSION: "20"

permissions:
  contents: write
  packages: write

jobs:
  # ── Validate tag format ────────────────────────────────────────────────────

  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.parse.outputs.version }}
      prerelease: ${{ steps.parse.outputs.prerelease }}
    steps:
      - name: Parse version from tag
        id: parse
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          if [[ "$VERSION" == *"-alpha"* || "$VERSION" == *"-beta"* || "$VERSION" == *"-rc"* ]]; then
            echo "prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi
          echo "Releasing version: ${VERSION} (prerelease: ${{ steps.parse.outputs.prerelease }})"

  # ── Run full test suite ────────────────────────────────────────────────────

  test:
    name: Full test suite
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            cli/package-lock.json

      - name: Install backend deps
        working-directory: backend
        run: npm ci

      - name: Install CLI deps
        working-directory: cli
        run: npm ci

      - name: Typecheck backend
        working-directory: backend
        run: npx tsc --noEmit

      - name: Typecheck CLI
        working-directory: cli
        run: npx tsc --noEmit

      - name: Test backend
        working-directory: backend
        run: npm test

      - name: Test CLI
        working-directory: cli
        run: npm test

  # ── Build CLI binaries (Linux / macOS / Windows) ──────────────────────────

  build-cli:
    name: Build CLI — ${{ matrix.platform }}
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        include:
          - platform: linux-x64
            pkg_target: node20-linux-x64
            output: ptf-linux-x64
          - platform: linux-arm64
            pkg_target: node20-linux-arm64
            output: ptf-linux-arm64
          - platform: macos-x64
            pkg_target: node20-macos-x64
            output: ptf-macos-x64
          - platform: macos-arm64
            pkg_target: node20-macos-arm64
            output: ptf-macos-arm64
          - platform: windows-x64
            pkg_target: node20-win-x64
            output: ptf-windows-x64.exe
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: cli/package-lock.json

      - name: Install deps
        working-directory: cli
        run: npm ci

      - name: Build TypeScript
        working-directory: cli
        run: npm run build

      - name: Package binary
        working-directory: cli
        run: |
          npx @yao-pkg/pkg dist/index.js \
            --target ${{ matrix.pkg_target }} \
            --output ${{ matrix.output }} \
            --compress GZip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: cli/${{ matrix.output }}

  # ── Build backend Docker image ────────────────────────────────────────────

  # ── Publish CLI to npm ────────────────────────────────────────────────────

  publish-npm:
    name: Publish @ptf/cli to npm
    runs-on: ubuntu-latest
    needs: [build-cli]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: cli/package-lock.json

      - name: Install deps
        working-directory: cli
        run: npm ci

      - name: Build
        working-directory: cli
        run: npm run build

      - name: Set version from tag
        working-directory: cli
        run: npm version ${{ needs.validate.outputs.version }} --no-git-tag-version

      - name: Publish
        working-directory: cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [[ "${{ needs.validate.outputs.prerelease }}" == "true" ]]; then
            npm publish --tag next --access public
          else
            npm publish --tag latest --access public
          fi

  # ── Create GitHub Release ─────────────────────────────────────────────────

  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [validate, build-cli, publish-npm]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Generate changelog
        id: changelog
        run: |
          # Extract changelog between this tag and the previous one
          PREV_TAG=$(git tag --sort=-version:refname | grep -v "^${GITHUB_REF_NAME}$" | head -1)
          if [ -z "$PREV_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" HEAD)
          else
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" ${PREV_TAG}..HEAD)
          fi
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: PTF v${{ needs.validate.outputs.version }}
          prerelease: ${{ needs.validate.outputs.prerelease }}
          body: |
            ## PTF v${{ needs.validate.outputs.version }}

            ### Installation

            ```bash
            # npm (recommandé)
            npm install -g @ptf/cli@${{ needs.validate.outputs.version }}

            # Binaire direct (Linux x64)
            curl -L https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/ptf-linux-x64 \
              -o /usr/local/bin/ptf && chmod +x /usr/local/bin/ptf

            # Binaire direct (macOS arm64)
            curl -L https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/ptf-macos-arm64 \
              -o /usr/local/bin/ptf && chmod +x /usr/local/bin/ptf
            ```

            ### Docker

            ```bash
            docker pull ghcr.io/${{ github.repository }}/backend:${{ needs.validate.outputs.version }}
            ```

            ### Changements

            ${{ steps.changelog.outputs.changelog }}

            ---
            *Généré automatiquement par GitHub Actions*
          files: |
            artifacts/linux-x64/ptf-linux-x64
            artifacts/linux-arm64/ptf-linux-arm64
            artifacts/macos-x64/ptf-macos-x64
            artifacts/macos-arm64/ptf-macos-arm64
            artifacts/windows-x64/ptf-windows-x64.exe

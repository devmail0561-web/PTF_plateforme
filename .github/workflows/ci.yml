name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: "20"

jobs:
  typecheck:
    name: TypeScript — typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            cli/package-lock.json
      - name: Install backend deps
        working-directory: backend
        run: npm ci
      - name: Install CLI deps
        working-directory: cli
        run: npm ci
      - name: Typecheck backend
        working-directory: backend
        run: npx tsc --noEmit
      - name: Typecheck CLI
        working-directory: cli
        run: npx tsc --noEmit

  test-backend:
    name: Backend — Jest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install deps
        working-directory: backend
        run: npm ci
      - name: Run tests
        working-directory: backend
        run: npm test

  test-cli:
    name: CLI — Vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - name: Install deps
        working-directory: cli
        run: npm ci
      - name: Run tests
        working-directory: cli
        run: npm test

  test-contracts:
    name: Contracts — Foundry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly
      - name: Install Foundry dependencies
        working-directory: contracts/evm
        run: |
          forge install OpenZeppelin/openzeppelin-contracts --no-commit
          forge install foundry-rs/forge-std --no-commit
      - name: Run Foundry tests
        working-directory: contracts/evm
        run: forge test -vv
      - name: Run Slither
        uses: crytic/slither-action@v0.4.0
        with:
          target: contracts/evm/
          slither-args: --exclude-dependencies

  build-cli:
    name: Build CLI
    runs-on: ubuntu-latest
    needs: [typecheck, test-backend, test-cli]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - name: Install deps
        working-directory: cli
        run: npm ci
      - name: Build
        working-directory: cli
        run: npm run build
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: cli-build
          path: cli/dist/
          retention-days: 7

  all-checks:
    name: ✅ All checks passed
    runs-on: ubuntu-latest
    needs: [typecheck, test-backend, test-cli, test-contracts, build-cli]
    if: always()
    steps:
      - name: Check all jobs
        run: |
          if [[ "${{ needs.typecheck.result }}" != "success" ||
                "${{ needs.test-backend.result }}" != "success" ||
                "${{ needs.test-cli.result }}" != "success" ||
                "${{ needs.test-contracts.result }}" != "success" ||
                "${{ needs.build-cli.result }}" != "success" ]]; then
            echo "One or more required checks failed"
            exit 1
          fi
          echo "All required checks passed"
